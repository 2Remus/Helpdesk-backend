# DATABASE
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/helpdesk

# Enable CORS
quarkus.http.cors=true

# Allow frontend origin (Vue dev server)
quarkus.http.cors.origins=http://localhost:5173

# Allow common headers and methods
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

#to enable mailing
quarkus.mailer.from=nhenry@gov.vc
quarkus.mailer.host=mail.gov.vc
quarkus.mailer.port=587
quarkus.mailer.start-tls=OPTIONAL
quarkus.mailer.username=nhenry@gov.vc
quarkus.mailer.password=xxxx
quarkus.mailer.auth=true

quarkus.log.category."io.quarkus.mailer".level=DEBUG
quarkus.log.category."io.vertx.ext.mail".level=DEBUG
