# JWT Authentication
mp.jwt.verify.issuer=cardtp
smallrye.jwt.sign.key-location=privateKey.pem
smallrye.jwt.sign.algorithm=RS256
quarkus.jwt.auth.claims=groups

# Signing key (used by Jwt.claims().sign())
mp.jwt.signer.key-location=privateKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.sign.key-format=PEM

# Verification key (used to validate incoming tokens)
quarkus.http.auth.proactive=true
mp.jwt.verify.publickey.location=publicKey.pem



#allow login without bearer token
quarkus.http.auth.permission.public.paths=/api/login,/api/register,/api/activate/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=POST


quarkus.smallrye-jwt.auth-mechanism=MP-JWT
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated



# Optional but recommended for debugging JWT handling
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG